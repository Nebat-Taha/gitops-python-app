name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  # Job 1: Build and Test (No Approval Needed)
  build:
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t gitops-python-app:${{ github.sha }} .

      - name: Save Docker Image
        run: docker save gitops-python-app:${{ github.sha }} > image.tar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-image
          path: image.tar
  # Job 2: Push (Requires Approval)
  Push:
    needs: build
    environment: dev 
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-image

      - name: Load Docker Image
        run: docker load < image.tar

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to DockerHub
        run: |
          docker tag gitops-python-app:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/gitops-python-app:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gitops-python-app:${{ github.sha }}

  update-manifest:
    needs: push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Manifest Repo
        uses: actions/checkout@v4
        with:
          repository: Nebat-Taha/gitops-manifests # <--- CHANGE THIS
          ssh-key: ${{ secrets.MANIFEST_REPO_KEY }}
          persist-credentials: true

      - name: Update Image Tag
        run: |
          # Use yq to update the deployment.yaml with the current SHA
          sed -i "s|image: nebat/gitops-python-app:.*|image: nebat/gitops-python-app:${{ github.sha }}|g" deployment.yaml
          
          # Commit and push
          git config user.name "CI Bot"
          git config user.email "bot@ci.com"
          git add deployment.yaml
          git commit -m "chore: update image to ${{ github.sha }}"
          git push